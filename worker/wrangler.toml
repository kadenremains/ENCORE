name = "encore-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[vars]
# sites allowed to call the API (localhost is always allowed for development)
ALLOWED_ORIGINS = "https://kadenremains.github.io"

[[d1_databases]]
binding = "DB"
database_name = "encore"
database_id = "4af968e3-0742-4f42-8803-3cc73178a2ca"

# Secrets (set in the Cloudflare dashboard, never committed):
#   LASTFM_API_KEY  - your Last.fm API key
#   LASTFM_SECRET   - your Last.fm "shared secret"
