name = "encore-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

# keep our own console lines (username + counts) but not per-request logs: request URLs carry
# usernames and album/artist lookups, which we don't want to keep
[observability.logs]
enabled = true
invocation_logs = false

[vars]
# sites allowed to call the API (localhost is always allowed for development)
ALLOWED_ORIGINS = "https://kadenremains.github.io"
# Last.fm accounts (lowercase) that see the owner stats in Settings and keep their own data key
# readable on the server (so the owner can read their own synced data). Everyone else stays private.
OWNERS = "realrx12stoutst"

[[d1_databases]]
binding = "DB"
database_name = "encore"
database_id = "4af968e3-0742-4f42-8803-3cc73178a2ca"

# Secrets (set in the Cloudflare dashboard, never committed):
#   LASTFM_API_KEY  - your Last.fm API key
#   LASTFM_SECRET   - your Last.fm "shared secret"
